[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litetwin"
version = "0.1.0"
license = {text = "MIT"}
description = "Closed-loop task-state feedback for robot manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = [
    "litetwin",
    "litetwin.policy",
    "litetwin.policy.feedback",
    "litetwin.policy.feedback.control",
    "litetwin.policy.feedback.inference",
    "litetwin.policy.feedback.model",
    "litetwin.policy.feedback.recovery",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
